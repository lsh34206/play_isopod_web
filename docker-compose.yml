version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: isopod_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: isopod_game

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isopod_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/isopod_game
      - JWT_SECRET=change_this_in_production_super_secret
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:5173
      - PORT=3001
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isopod_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  mongo_data:
